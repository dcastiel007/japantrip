/* ==========================================================
   טוקנים — odysee-tokens.css
   בהיר כברירת מחדל, כהה לפי מערכת ההפעלה או לפי המתג.
   ========================================================== */
:root{
  --navy:#0C1F3F; --navy-deep:#08152C;
  --red:#B85A3E; --red-deep:#8E3D24;
  --ivory:#F6F4EF; --paper:#FFFFFF;
  --mist-50:#F4F6FA; --mist-100:#E7EBF2; --mist-200:#CDD4E0;
  --mist-300:#A6AFC0; --mist-500:#6B7588; --mist-700:#3D475A;

  --ground:var(--ivory);
  --surface:var(--paper);
  --sunken:var(--mist-50);
  --ink:var(--navy);
  --ink2:var(--mist-700);
  --ink3:var(--mist-500);
  --line:var(--mist-100);
  --line2:var(--mist-200);

  --accent:var(--red);
  --accent-ink:var(--red-deep);
  --accent-on:#FFFFFF;
  --accent-bg:#F5E9E4;
  --good:#1F8A5B;      --good-bg:#E6F2EC;
  --warn:#C58A1A;      --warn-bg:#FBF2DF;
  --info:#2A6FDB;      --info-bg:#E8EFFB;

  --shadow-sm:0 1px 2px rgba(12,31,63,.06), 0 1px 1px rgba(12,31,63,.04);
  --shadow-md:0 6px 16px -6px rgba(12,31,63,.16), 0 2px 4px rgba(12,31,63,.04);

  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --sans:'Heebo','Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Sora','Heebo',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --jp:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:var(--navy); --surface:var(--navy-deep); --sunken:#060F22;
    --ink:var(--paper); --ink2:#B5BCC9; --ink3:#6B7588;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --accent:#FF6A5F; --accent-ink:#FF8A80; --accent-bg:rgba(255,106,95,.13); --accent-on:#0C1F3F;
    --good:#3FBF85; --good-bg:rgba(63,191,133,.13);
    --warn:#E0AE45; --warn-bg:rgba(224,174,69,.13);
    --info:#6C9BEC; --info-bg:rgba(108,155,236,.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 16px -6px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:var(--navy); --surface:var(--navy-deep); --sunken:#060F22;
  --ink:var(--paper); --ink2:#B5BCC9; --ink3:#6B7588;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --accent:#FF6A5F; --accent-ink:#FF8A80; --accent-bg:rgba(255,106,95,.13); --accent-on:#0C1F3F;
  --good:#3FBF85; --good-bg:rgba(63,191,133,.13);
  --warn:#E0AE45; --warn-bg:rgba(224,174,69,.13);
  --info:#6C9BEC; --info-bg:rgba(108,155,236,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 16px -6px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.3);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.55;
  letter-spacing:-.005em;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.jp{font-family:var(--jp)}
bdi{unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--ground); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex; align-items:center; gap:9px;
}
header .brand{flex:1;min-width:0}
header .mark{width:30px;height:30px;flex:0 0 auto;fill:var(--accent)}
header .brand b{
  display:block; font-family:var(--disp); font-weight:800; font-size:20px;
  letter-spacing:-.035em; line-height:1.15;
}
header .brand small{
  display:block; font-size:10px; font-weight:600; color:var(--ink3);
  letter-spacing:.24em; text-transform:uppercase; margin-top:3px;
}
.iconbtn{
  width:42px;height:42px;border-radius:var(--r-md);border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:background var(--ease) 140ms;
}
.iconbtn:active{background:var(--sunken)}
.iconbtn[disabled]{opacity:.55;cursor:default}
.iconbtn.spin svg{animation:jp-spin 900ms linear infinite;transform-origin:50% 50%}
@keyframes jp-spin{to{transform:rotate(-360deg)}}
#rtoast{
  position:fixed;left:50%;z-index:70;
  bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
  transform:translateX(-50%) translateY(14px);
  max-width:min(92vw,430px);
  background:var(--ink);color:var(--surface);
  padding:12px 17px;border-radius:var(--r-md);
  font-size:14px;line-height:1.55;text-align:center;
  box-shadow:var(--shadow-md);
  opacity:0;pointer-events:none;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease);
}
#rtoast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){
  .iconbtn.spin svg{animation:none}
  #rtoast{transition:none}
}
main{padding:16px 14px 28px;max-width:760px;margin:0 auto}

/* ---------- generic ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px;margin-bottom:12px;box-shadow:var(--shadow-sm);
}
h2{
  font-family:var(--disp); font-size:12px; font-weight:600; margin:26px 0 11px;
  color:var(--ink3); letter-spacing:.12em;
}
h2:first-child{margin-top:0}
.muted{color:var(--ink3);font-size:14.5px}

/* ---------- hero ---------- */
.hero{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:26px 18px; text-align:center;
  box-shadow:var(--shadow-md); margin-bottom:14px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);
}
.hero .big{
  font-family:var(--disp); font-size:64px; font-weight:800; line-height:1;
  letter-spacing:-.035em; color:var(--accent); font-variant-numeric:tabular-nums;
}
.hero .lbl{font-size:16px;color:var(--ink);margin-top:8px;font-weight:500}
.hero .sub{font-size:13px;color:var(--ink3);margin-top:10px}

/* ---------- day list ---------- */
.daybtn{
  width:100%;display:flex;align-items:center;gap:13px;text-align:right;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer;min-height:62px;
  box-shadow:var(--shadow-sm); transition:transform var(--ease) 140ms;
}
.daybtn:active{transform:scale(.99)}
.daybtn .dnum{
  flex:0 0 auto;width:48px;height:48px;border-radius:var(--r-md);background:var(--sunken);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  font-family:var(--disp);
}
.daybtn .dnum b{font-size:20px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.daybtn .dnum span{font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:3px}
.daybtn .dmain{flex:1;min-width:0}
.daybtn .dmain b{display:block;font-size:16px;font-weight:600}
.daybtn .dmain span{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.daybtn .chev{color:var(--ink3);font-size:20px;direction:ltr;unicode-bidi:isolate}
.daybtn.city-tokyo .dnum{background:var(--info-bg);color:var(--info)}
.daybtn.city-osaka .dnum{background:var(--accent-bg);color:var(--accent)}
.daybtn.city-kyoto .dnum{background:var(--good-bg);color:var(--good)}
.daybtn.city-hakone .dnum{background:var(--warn-bg);color:var(--warn)}
.daybtn.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-md)}

/* ---------- item ---------- */
.item{display:flex;gap:12px;margin-bottom:12px}
.rail{flex:0 0 54px;text-align:center;padding-top:3px}
.rail .tm{font-family:var(--mono);font-size:14px;font-weight:600;direction:ltr;unicode-bidi:isolate;color:var(--ink2);font-variant-numeric:tabular-nums}
.rail .ic{font-size:20px;margin-top:5px;display:block}
.body{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-sm);
}
.body .nm{font-size:17.5px;font-weight:600;line-height:1.32;letter-spacing:-.015em}
.body .en{font-family:var(--disp);font-size:12px;color:var(--ink3);margin-top:3px;direction:ltr;text-align:right;unicode-bidi:isolate;letter-spacing:-.01em}
.body .ja{font-size:13px;color:var(--ink3);margin-top:1px}
.row{display:flex;gap:8px;font-size:14.5px;color:var(--ink2);margin-top:9px;align-items:flex-start}
.row .k{flex:0 0 auto;opacity:.7;font-size:13px;line-height:1.6}
.dolist{margin:11px 0 0;padding:0;list-style:none}
.dolist li{
  position:relative;padding-inline-start:19px;font-size:14.5px;color:var(--ink);
  line-height:1.5;margin-bottom:6px;
}
.dolist li:last-child{margin-bottom:0}
.dolist li::before{
  content:"";position:absolute;inset-inline-start:4px;top:.62em;
  width:6px;height:6px;border-radius:50%;background:var(--accent);
}
.dohead{
  font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.12em;
  color:var(--ink3);margin-top:13px;
}
.note{font-size:14.5px;color:var(--ink2);margin-top:10px;line-height:1.5}
.pill{display:inline-block;font-size:13px;padding:6px 11px;border-radius:var(--r-md);margin-top:10px;line-height:1.45}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.book{background:var(--good-bg);color:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--sunken);border:1px solid var(--line2);color:var(--ink);
  border-radius:var(--r-md);padding:0 14px;height:44px;
  font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:background var(--ease) 140ms;
}
.btn:active{background:var(--line)}
.btn.solid{background:var(--accent);border-color:transparent;color:var(--accent-on)}
.btn.solid:active{background:var(--red-deep)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  border-radius:var(--r-pill);padding:0 15px;height:44px;display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:14.5px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-on);border-color:transparent;font-weight:600}
.daynav{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.daynav.bottom{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.daynav .chip{flex:0 1 auto;min-width:0;padding:0 12px;font-size:13.5px;white-space:nowrap;overflow:hidden}
.daynav .chip:nth-child(2){flex:0 0 auto}
.dayhead{
  font-family:var(--disp);font-size:11px;color:var(--ink3);margin:20px 0 9px;
  font-weight:600;letter-spacing:.12em;
}

/* ---------- tasks ---------- */
.tk{
  display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  align-items:flex-start;
}
.tk .box{
  flex:0 0 auto;width:26px;height:26px;border-radius:var(--r-sm);
  border:1.5px solid var(--line2);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:2px;
}
.tk[data-done="1"] .box{background:var(--good);border-color:var(--good)}
.tk[data-done="1"] .tmain{opacity:.45}
.tk[data-done="1"] .tmain b{text-decoration:line-through}
.tk .tmain{flex:1;min-width:0}
.tk .tmain b{font-size:16px;font-weight:600;line-height:1.35;display:block}
.tk .tmain .tnote{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}
.tk .tdate{
  font-family:var(--mono);font-size:12px;font-weight:600;direction:ltr;unicode-bidi:isolate;
  margin-top:7px;display:inline-block;padding:3px 8px;border-radius:var(--r-sm);
  background:var(--sunken);color:var(--ink3);
}
.tk.due .tdate{background:var(--accent-bg);color:var(--accent)}
.tk.past .tdate{background:var(--warn-bg);color:var(--warn)}

/* ---------- phrases ---------- */
.ph{border-bottom:1px solid var(--line);padding:13px 0}
.ph:last-child{border-bottom:0;padding-bottom:0}
.ph .he{font-size:15px;color:var(--ink2)}
.ph .jaline{font-size:22px;margin-top:6px;line-height:1.4;font-weight:500}
.ph .ro{font-family:var(--disp);font-size:12.5px;color:var(--ink3);direction:ltr;text-align:right;unicode-bidi:isolate;margin-top:3px}

/* ---------- tabs ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:0;color:var(--ink3);font:inherit;font-size:10.5px;font-weight:500;
  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:62px;
  position:relative;
}
nav button .g{font-size:20px;line-height:1}
nav button[aria-current="true"]{color:var(--accent);font-weight:700}
nav button[aria-current="true"]::before{
  content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--accent);border-radius:0 0 2px 2px;
}
nav .badge{
  position:absolute;top:6px;left:calc(50% + 9px);
  min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-on);
  font-family:var(--mono);font-size:10px;font-weight:600;line-height:17px;padding:0 4px;
}

/* ---------- taxi overlay ---------- */
#taxi{
  position:fixed;inset:0;z-index:100;background:#fff;color:#0C1F3F;
  direction:ltr;text-align:left;
  display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  overflow-y:auto;
}
#taxi.on{display:flex}
#taxi .top{display:flex;flex-direction:row-reverse;align-items:center;gap:10px;margin-bottom:14px}
#taxi .top .t{flex:1;font-size:15px;color:#6B7588;direction:rtl;text-align:right}
#taxi .x{width:46px;height:46px;border-radius:10px;border:1px solid #CDD4E0;background:#fff;font-size:22px;cursor:pointer;color:#0C1F3F}
#taxi .banner{background:#0C1F3F;color:#fff;border-radius:10px;padding:11px 14px;font-size:17px;text-align:center;margin-bottom:20px}
#taxi .jname{font-size:29px;font-weight:700;line-height:1.3;margin-bottom:14px}
#taxi .jaddr{font-size:40px;font-weight:700;line-height:1.45}
#taxi .tel{margin-top:22px;font-size:26px;font-family:'JetBrains Mono',ui-monospace,monospace}
#taxi .tel a{color:#B85A3E}
#taxi .heb{font-size:15px;color:#6B7588;margin-top:14px;direction:rtl;text-align:right}
#taxi .foot{margin-top:auto;padding-top:22px;font-size:13px;color:#A6AFC0;border-top:1px solid #E7EBF2;font-family:'Sora',sans-serif}
@media (max-width:360px){ #taxi .jaddr{font-size:32px} }
/* ---------- חיפוש ---------- */
.sbox{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r-md);padding:0 13px;height:52px;
  margin-bottom:14px;box-shadow:var(--shadow-sm);
}
.sbox .sic{flex:0 0 auto;font-size:16px;opacity:.55;line-height:1}
#sq{
  flex:1;min-width:0;border:0;background:none;color:var(--ink);
  font:inherit;font-size:16.5px;padding:0;outline:none;
}
#sq::placeholder{color:var(--ink3)}
#sq::-webkit-search-cancel-button,#sq::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sclear{
  flex:0 0 auto;width:32px;height:32px;border-radius:var(--r-sm);border:0;
  background:var(--sunken);color:var(--ink3);font-size:13px;cursor:pointer;display:none;
}
.sclear.on{display:block}
.scount{font-size:13px;color:var(--ink3);margin:0 0 4px}
.sr{
  width:100%;display:flex;align-items:center;gap:12px;text-align:right;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 13px;margin-bottom:9px;color:inherit;font:inherit;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform var(--ease) 140ms;
}
.sr:active{transform:scale(.99)}
.sr .srtag{
  flex:0 0 auto;min-width:46px;height:40px;padding:0 8px;border-radius:var(--r-md);
  background:var(--sunken);color:var(--ink2);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12.5px;font-weight:600;direction:ltr;unicode-bidi:isolate;
}
.sr.city-tokyo .srtag{background:var(--info-bg);color:var(--info)}
.sr.city-osaka .srtag{background:var(--accent-bg);color:var(--accent)}
.sr.city-kyoto .srtag{background:var(--good-bg);color:var(--good)}
.sr.city-hakone .srtag{background:var(--warn-bg);color:var(--warn)}
.sr .srmain{flex:1;min-width:0}
.sr .srmain b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.sr .srmain span{
  display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* הבזק על היעד אחרי קפיצה מתוצאת חיפוש */
.item .body,.tk,.card,.ph{transition:box-shadow 420ms var(--ease)}
.item.flash .body,.tk.flash,.card.flash{box-shadow:0 0 0 2px var(--accent),var(--shadow-md)}
.ph.flash{box-shadow:0 0 0 2px var(--accent);border-radius:var(--r-md)}
@media (max-width:380px){
  nav button{font-size:9.5px;padding-left:0;padding-right:0}
}

/* בידוד דו-כיווני: מקף בין שני מספרים הוא תו נייטרלי, ואלגוריתם
   ה-bidi הופך את סדר שני הצדדים בהקשר עברי. LRI/PDI נועל את הרצף.
   סימן המטבע חייב להיכלל, אחרת ¥3,600 מתהפך. */
/* כתובת יפנית שנוגעת בספרות (京都市東山区本町15丁目778) חייבת להתבודד
   כיחידה אחת. בלי זה כל קבוצת ספרות מתבודדת לחוד, והכתובת מוצגת
   בסדר שגוי — «778京都市東山区本町15丁目». הסניף של הכתובת חייב
   לבוא ראשון בסירוגין, אחרת ענף המספרים יתפוס אותו קודם. */
const JPADDR = "[぀-ヿ一-鿿ー々〇]+[\\d０-９][\\d０-９\\-−ー丁目番地条の合]*[぀-ヿ一-鿿ー々〇\\d０-９\\-−ー]*";
const RANGE = new RegExp(JPADDR + "|[¥$₪€]?\\d[\\d:.,\\/–—−\\-]*\\d", "g");
const bidi = s => String(s).replace(RANGE, m => "⁦" + m + "⁩");
const esc = s => bidi((s==null?"":String(s))).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* rich() זהה ל-esc אבל ממיר **הדגשה** ל-<b>. הנתונים ב-data.json
   כתובים במרקדאון קל, ובלי זה הכוכביות מוצגות כטקסט (64 מופעים).
   ההמרה קורית אחרי הבריחה, ולכן היא בטוחה.
   ⚠️ לשימוש בתוכן בלבד — לעולם לא בתוך ערך של attribute. */
/* escA() — בריחת HTML בלבד, בלי בידוד דו-כיווני. לערכי attribute
   שנצרכים כנתון ולא כטקסט לקריאה: כתובת לנהג המונית, טלפון, URL.
   ⚠️ בלי זה תווי LRI/PDI בלתי-נראים נכנסים לתוך הכתובת היפנית,
   ומי שיעתיק אותה לחיפוש יגרור אותם איתו. */
const escA = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const dow = d => DOW[new Date(d+"T00:00:00").getDay()];
const ddm = d => d.slice(8,10)+"."+d.slice(5,7);
/* חייב להיות התאריך המקומי ולא UTC. toISOString מחזיר UTC, וביפן
   (UTC+9) זה היה מציג את היום של אתמול עד 09:00 בבוקר מקומי. */
const ymd = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const today = () => ymd(new Date());
/* הפרש ימים חייב להיחשב על מספרי יום ולא על הפרש מילישניות:
   בין אוגוסט לנובמבר יש מעבר שעון חורף, והשעה הנוספת גררה יום שלם. */
const dayNum = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/864e5;
const gmap = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

function itemHTML(it){
  const c = CAT[it.cat] || {ic:"•"};
  let h = '<div class="item" data-sk="'+escA(skey(it))+'"><div class="rail">';
  h += '<div class="tm">'+(it.t?esc(it.t):"—")+'</div>';
  h += '<span class="ic">'+c.ic+'</span></div><div class="body">';
  h += '<div class="nm">'+esc(it.n)+'</div>';
  if(it.en) h += '<div class="en">'+esc(it.en)+'</div>';
  if(it.ja) h += '<div class="ja jp">'+esc(it.ja)+'</div>';
  if(it.st)    h += '<div class="row"><span class="k">🚇</span><span>'+rich(it.st)+'</span></div>';
  if(it.hrs)   h += '<div class="row"><span class="k">🕐</span><span>'+rich(it.hrs)+'</span></div>';
  if(it.price) h += '<div class="row"><span class="k">💴</span><span>'+rich(it.price)+'</span></div>';
  if(it.note)  h += '<div class="note">'+rich(it.note)+'</div>';
  if(it.do && it.do.length){
    h += '<div class="dohead">מה עושים שם</div><ul class="dolist">'
       + it.do.map(x=>'<li>'+rich(x)+'</li>').join("") + '</ul>';
  }
  if(it.book)  h += '<div class="pill book">🎫 '+rich(it.book)+'</div>';
  if(it.warn)  h += '<div class="pill warn">⚠️ '+rich(it.warn)+'</div>';
  if(it.addr){
    h += '<div class="acts">';
    h += '<button class="btn solid" data-addr="'+escA(it.addr)+'" data-ja="'+escA(it.ja||"")+'" data-tel="'+escA(it.tel||"")+'" data-he="'+esc(it.n)+'" data-en="'+esc(it.en||"")+'">🚕 כתובת לנהג</button>';
    h += '<a class="btn" target="_blank" rel="noopener" href="'+gmap((it.ja||it.en||it.n)+" "+it.addr)+'">🗺 מפה</a>';
    if(it.url) h += '<a class="btn" target="_blank" rel="noopener" href="'+escA(it.url)+'">↗ אתר</a>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

function dayRouteLink(day){
  const pts = day.items.filter(x=>x.addr && x.cat!=="logi").map(x=>x.addr);
  if(pts.length < 2) return "";
  const origin = encodeURIComponent(pts[0]);
  const dest = encodeURIComponent(pts[pts.length-1]);
  const mid = pts.slice(1,-1).slice(0,8).map(encodeURIComponent).join("|");
  const url = "https://www.google.com/maps/dir/?api=1&origin="+origin+"&destination="+dest
            + (mid ? "&waypoints="+mid : "") + "&travelmode=transit";
  return '<a class="btn" style="margin-bottom:14px" target="_blank" rel="noopener" href="'+url+'">🗺 מסלול היום ב-Google Maps</a>';
}

function dayBlock(day){
  let h = '<h2>יום '+dow(day.d)+' · <span class="mono">'+ddm(day.d)+'</span> · '+day.cityHe+'</h2>';
  h += dayRouteLink(day);
  h += day.items.length ? day.items.map(itemHTML).join("")
     : '<div class="card muted">היום הזה עדיין בהכנה.</div>';
  return h;
}

let DONE = {};
try{ DONE = JSON.parse(localStorage.getItem("jp-done")||"{}"); }catch(e){ DONE = {}; }
/* גרסאות עד v31 שמרו את המפתח עם תווי בידוד דו-כיווני, ולכן
   הסימון לא נמצא בקריאה. מנקים פעם אחת כדי שסימונים ישנים יחזרו. */
(function(){
  let fixed = false;
  Object.keys(DONE).forEach(k=>{
    const c = k.replace(/[⁦-⁩]/g,"");
    if(c !== k){ delete DONE[k]; DONE[c] = 1; fixed = true; }
  });
  if(fixed){ try{ localStorage.setItem("jp-done", JSON.stringify(DONE)); }catch(e){} }
})();
const saveDone = ()=>{ try{ localStorage.setItem("jp-done", JSON.stringify(DONE)); }catch(e){} };
const tkey = tk => tk.d + "|" + tk.n;

function openTasks(){ return DATA.tasks.filter(tk=>!DONE[tkey(tk)]); }
function nextTasks(n){
  const t = today();
  return openTasks().filter(tk=>tk.d>=t).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,n);
}
function taskHTML(tk){
  const t = today();
  const done = !!DONE[tkey(tk)];
  const cls = done ? "" : (tk.d < t ? " past" : (tk.d <= addDays(t,14) ? " due" : ""));
  let h = '<div class="tk'+cls+'" data-done="'+(done?1:0)+'" data-k="'+escA(tkey(tk))+'">';
  h += '<button class="box" aria-label="סמן כבוצע">'+(done?"✓":"")+'</button>';
  h += '<div class="tmain"><b>'+(TCAT[tk.cat]||"")+' '+esc(tk.n)+'</b>';
  if(tk.note) h += '<div class="tnote">'+rich(tk.note)+'</div>';
  h += '<span class="tdate">'+esc(ddm(tk.d))+'</span></div></div>';
  return h;
}
function addDays(d,n){ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return ymd(x); }

V.tasks = function(){
  const t = today();
  const all = DATA.tasks.slice().sort((a,b)=>a.d.localeCompare(b.d));
  const past = all.filter(tk=>tk.d < t && !DONE[tkey(tk)]);
  const soon = all.filter(tk=>tk.d >= t && tk.d <= addDays(t,30) && !DONE[tkey(tk)]);
  const later= all.filter(tk=>tk.d >  addDays(t,30) && !DONE[tkey(tk)]);
  const done = all.filter(tk=>DONE[tkey(tk)]);
  let h = "";
  if(past.length)  h += '<h2>עבר התאריך</h2>'   + past.map(taskHTML).join("");
  if(soon.length)  h += '<h2>30 הימים הקרובים</h2>' + soon.map(taskHTML).join("");

};

/* ---------- חיפוש ----------
   מחפשים בנתונים הגולמיים, לא בטקסט המרונדר: הרינדור מזריק תווי
   בידוד דו-כיווני (LRI/PDI) לתוך כל רצף מספרי, וחיפוש טקסט עליהם
   נכשל. loose() מוריד ניקוד, גרשיים, מקפים ופיסוק משני הצדדים,
   ולכן «צ'ק אין» מוצא «צ׳ק-אין» ו-«teamlab» מוצא «teamLab». */
const LOOSE_KEEP = /[^0-9a-zא-ת぀-ヿ一-鿿ｦ-ﾟ]+/g;
const loose = s => String(s==null?"":s).toLowerCase()
  .replace(/[֑-ׇ]/g,"")
  .replace(/['׳’`״"“”]/g,"")
  .replace(LOOSE_KEEP," ").replace(/\s+/g," ").trim();
/* dataset מחזיר את הערך אחרי פענוח HTML, אבל תווי הבידוד נשארים.
   השוואת מפתחות חייבת לרוץ על שני הצדדים אחרי הסרה. */
const strip = s => String(s==null?"":s).replace(/[⁦-⁩]/g,"");
const skey = it => it.d + "|" + (it.t||"") + "|" + it.n;

const SIDX = [];
(function(){
  let ord = 0;
  DAYS.forEach(day=>{
    SIDX.push({kind:"day", go:"day", ord:ord++, d:day.d, sk:day.d, city:day.city,
      tag:String(day.i),
      title:"יום " + dow(day.d) + " · " + day.cityHe,
      sub:ddm(day.d) + " · " + day.items.length + " פריטים",
      blob:loose([day.cityHe, "יום "+dow(day.d), ddm(day.d),
                  day.items.map(x=>x.n).join(" ")].join(" ")),
      lt:loose(day.cityHe + " יום " + dow(day.d) + " " + ddm(day.d))});
    day.items.forEach(it=>{
      SIDX.push({kind:"item", go:"item", ord:ord++, d:day.d, sk:skey(it), city:day.city,
        tag:ddm(day.d),
        title:it.n,
        sub:(it.t ? it.t + " · " : "") + "יום " + dow(day.d) + " · " + day.cityHe
            + (it.en ? " · " + it.en : ""),
        blob:loose([it.n, it.en, it.ja, it.st, it.note, it.book, it.warn,
                    it.price, it.hrs, it.addr, (it.do||[]).join(" ")].join(" ")),
        lt:loose(it.n + " " + (it.en||""))});
    });
  });
  DATA.hotels.forEach(ht=>{
    SIDX.push({kind:"hotel", go:"hotel", ord:ord++, sk:"hotel|"+ht.n, tag:"🏨",
      title:ht.n, sub:ht.dates || "",
      blob:loose([ht.n, ht.ja, ht.dates, ht.note, ht.addr, ht.tel].join(" ")),
      lt:loose(ht.n)});
  });
  DATA.tasks.forEach(tk=>{
    SIDX.push({kind:"task", go:"task", ord:ord++, sk:tkey(tk), tag:"✓",
      title:tk.n, sub:ddm(tk.d),
      blob:loose([tk.n, tk.note, ddm(tk.d)].join(" ")),
      lt:loose(tk.n)});
  });
  DATA.phrases.forEach(p=>{
    SIDX.push({kind:"phrase", go:"phrase", ord:ord++, sk:"ph|"+p[1], tag:"あ",
      title:p[0], sub:(p[2]||""),
      blob:loose([p[0], p[1], p[2], p[3]||""].join(" ")),
      lt:loose(p[0])});
  });
})();

const SGROUP = [["item","במסלול"],["day","ימים שלמים"],["hotel","מלונות"],
                ["task","משימות"],["phrase","יפנית"]];
const SHINT = '<div class="card muted">מחפש בשמות, בהערות, בתחנות, בשעות, בכתובות, '
  + 'במלונות, במשימות ובמשפטים ביפנית — בכל ששת עשר הימים. '

function srHTML(r){
  return '<button class="sr'+(r.city ? " city-"+r.city : "")+'" data-go="'+r.go+'"'
    + ' data-sk="'+escA(r.sk)+'" data-d="'+escA(r.d||"")+'">'
    + '<span class="srtag">'+esc(r.tag)+'</span>'
    + '<span class="srmain"><b>'+esc(r.title)+'</b><span>'+esc(r.sub)+'</span></span></button>';
}

function runSearch(){
  const box = document.getElementById("sres");
  if(!box) return;
  const cl = document.getElementById("sclear");
  const sg = document.getElementById("sugg");
  const q = (V._q||"").trim();
  if(cl) cl.classList.toggle("on", !!q);
  /* ההצעות תופסות שתי שורות. ברגע שיש שאילתה הן יורדות מהמסך
     כדי שהתוצאה הראשונה תהיה גלויה בלי גלילה. */
  if(sg) sg.style.display = q ? "none" : "";
  const toks = q.split(/\s+/).map(loose).filter(Boolean);
  if(!toks.length){ box.innerHTML = SHINT; return; }
  const hits = SIDX.filter(r => toks.every(t => r.blob.indexOf(t) >= 0));
  if(!hits.length){
    box.innerHTML = '<div class="card muted">לא נמצא כלום ל־«'+esc(q)+'». '
      + 'נסו מילה אחת בלבד, או רק חלק ממנה.</div>';
    return;
  }
  hits.forEach(r => { r._s = toks.every(t => r.lt.indexOf(t) >= 0) ? 0 : 1; });
  hits.sort((a,b) => (a._s - b._s) || (a.ord - b.ord));
  let h = '<div class="scount">'
        + esc(hits.length === 1 ? "תוצאה אחת" : hits.length + " תוצאות") + '</div>';
  SGROUP.forEach(g=>{
    const list = hits.filter(r => r.kind === g[0]);
    if(!list.length) return;
    h += '<h2>'+g[1]+'</h2>' + list.map(srHTML).join("");
  });
  box.innerHTML = h;
}

/* קפיצה מתוצאה אל הפריט עצמו, במסך שבו הוא באמת חי */
function flashTo(sel, key){
  const want = strip(key);
  requestAnimationFrame(()=>{
    let el = null;
    document.querySelectorAll(sel).forEach(x=>{
      if(el) return;
      if(strip(x.dataset.sk || x.dataset.k || "") === want) el = x;
    });
    if(!el) return;
    el.scrollIntoView({block:"center"});
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"), 2600);
  });
}
function goResult(ds){
  if(ds.go === "day" || ds.go === "item"){
    view = "days"; render(); showDay(ds.d || ds.sk);
    if(ds.go === "item") flashTo(".item", ds.sk);
  } else if(ds.go === "hotel"){ view = "info"; render(); flashTo(".card", ds.sk); }
  else if(ds.go === "task"){ view = "tasks"; render(); flashTo(".tk", ds.sk); }
  else if(ds.go === "phrase"){ view = "info"; render(); flashTo(".ph", ds.sk); }
}

/* אחרי כל רינדור של מסך החיפוש: להחזיר את השאילתה, לחבר מאזין
   ולפתוח את המקלדת. הקלדה מעדכנת רק את #sres ולא מרנדרת מחדש —
   רינדור מלא היה גוזל את הפוקוס מהשדה אחרי כל תו. */
function afterRender(){
  if(view !== "search") return;
  const inp = document.getElementById("sq");
  if(!inp) return;
  inp.value = V._q || "";
  inp.addEventListener("input", ()=>{ V._q = inp.value; runSearch(); });
  inp.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ V._q = ""; inp.value = ""; runSearch(); }
  });
  runSearch();
  try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); }
}

/* ---------- router ---------- */
let view = "today";
const SUB = {today:"נובמבר 2026 · 16 ימים", days:"כל הימים", tasks:"לפני הנסיעה",
             search:"חיפוש בכל המסלול",
             cats:"לפי קטגוריה", info:"מלונות · יפנית · חירום"};
function render(){
  const app = document.getElementById("app");
  app.innerHTML = V[view]();
  window.scrollTo(0,0);
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.v===view));
  document.getElementById("hsub").textContent = bidi(SUB[view]);
  badge();
  afterRender();

function badge(){
  const b = document.querySelector('nav button[data-v="tasks"]');
  const old = b.querySelector(".badge"); if(old) old.remove();
  const n = openTasks().filter(tk=>tk.d <= addDays(today(),30)).length;
  if(n){ const s=document.createElement("span"); s.className="badge"; s.textContent=n; b.appendChild(s); }
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>{ view=b.dataset.v; render(); });
});

document.addEventListener("click", e=>{
  const t = e.target.closest("button[data-addr]");
  if(t){ openTaxi(t.dataset); return; }
  const bx = e.target.closest(".tk .box");
  if(bx){
    const k = bx.closest(".tk").dataset.k;
    if(DONE[k]) delete DONE[k]; else DONE[k]=1;
    saveDone(); render(); return;
  }
  const sx = e.target.closest("#sclear");
  if(sx){
    V._q = "";
    const i = document.getElementById("sq");
    if(i){ i.value = ""; i.focus(); }
    runSearch(); return;
  }
  const sg = e.target.closest("[data-q]");
  if(sg){
    V._q = sg.dataset.q;
    const i = document.getElementById("sq");
    if(i) i.value = V._q;
    runSearch(); return;
  }
  const sr = e.target.closest(".sr");
  if(sr){ goResult(sr.dataset); return; }
  const c = e.target.closest(".chip");
  if(c && c.dataset.c){ V._cat = c.dataset.c; render(); return; }
  const d = e.target.closest(".daybtn");
  if(d){ showDay(d.dataset.d); return; }
  const step = e.target.closest("[data-step]");
  if(step){ if(step.dataset.step==="__all"){ render(); } else { showDay(step.dataset.step); } return; }
});

/* מסך יום בודד, עם מעבר ליום הקודם והבא */
function showDay(dstr){
  const idx = DAYS.findIndex(x=>x.d===dstr);
  if(idx < 0) return;
  const day = DAYS[idx], prev = DAYS[idx-1], next = DAYS[idx+1];
  const list = document.getElementById("daylist");
  if(list) list.style.display="none";
  const one = document.getElementById("dayone");
  one.style.display="block";

  /* בלי חיצים: הם מתהפכים בהקשר RTL והמילה לבדה חד-משמעית */
  const arrow = (dy,label)=> dy
    ? '<button class="chip" data-step="'+dy.d+'">'+label+' <span class="mono">'+ddm(dy.d)+'</span></button>'
    : '<button class="chip" disabled style="opacity:.35">'+label+'</button>';

  const btns = arrow(prev,"הקודם")
    + '<button class="chip" data-step="__all">↩ כל הימים</button>'
    + arrow(next,"הבא");
  /* אותו ניווט גם בתחתית — היום ארוך ולא הגיוני לגלול חזרה למעלה */
  one.innerHTML = '<div class="daynav">' + btns + '</div>'
                + dayBlock(day)
                + '<div class="daynav bottom">' + btns + '</div>';
  window.scrollTo(0,0);
}

/* ---------- taxi card ---------- */
const taxi = document.getElementById("taxi");
function openTaxi(ds){
  document.getElementById("tx-name").textContent = ds.ja || "";
  document.getElementById("tx-addr").textContent = ds.addr || "";
  const tel = document.getElementById("tx-tel");
  tel.innerHTML = ds.tel ? '☎ <a href="tel:'+ds.tel.replace(/[^+\d]/g,"")+'">'+ds.tel+'</a>' : "";
  document.getElementById("tx-heb").textContent = ds.he || "";

document.getElementById("homebtn").addEventListener("click",()=>{ view="today"; render(); });

/* ---------- רענון: משיכת גרסה חדשה מהרשת ----------
   מבטל את הרישום של ה-service worker, מוחק את כל המטמון, וטוען מחדש
   עם פרמטר שמונע מהדפדפן להגיש עותק ישן.
   ⚠️ אם אין רשת — לא נוגעים בכלום. מחיקת המטמון בלי רשת משאירה
   אפליקציה ריקה, וזה בדיוק מה שאסור שיקרה באמצע נסיעה.
   הסימונים של המשימות ומצב התצוגה יושבים ב-localStorage ולא נמחקים. */
(function(){
  const btn = document.getElementById("reloadbtn");
  if(!btn) return;
  function say(msg, ms){
    let el = document.getElementById("rtoast");
    if(!el){ el = document.createElement("div"); el.id = "rtoast";
             el.setAttribute("role","status"); document.body.appendChild(el); }
    el.textContent = msg;
    requestAnimationFrame(()=>el.classList.add("on"));
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), ms || 4200);
  }
  btn.addEventListener("click", async ()=>{
    if(btn.dataset.busy) return;
    if(navigator.onLine === false){
      say("אין חיבור לרשת. האפליקציה עובדת אופליין כרגיל — הרענון ימשוך גרסה חדשה כשתהיה רשת.");
      return;
    }
    btn.dataset.busy = "1";
    btn.disabled = true;
    btn.classList.add("spin");
    say("מרענן…", 9000);
    try{
      if("serviceWorker" in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister().catch(()=>{})));
      }
      if(window.caches){
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k).catch(()=>{})));
      }
    }catch(e){}
    location.replace(location.pathname + "?r=" + Date.now());
  });
})();

document.getElementById("taxix").addEventListener("click",()=>{
  taxi.classList.remove("on"); document.body.style.overflow="";
});

/* ---------- theme ---------- */
(function(){
  let saved=null;
  try{ saved = localStorage.getItem("jp-theme"); }catch(e){}
  const stamped = document.documentElement.getAttribute("data-theme");
  if(!saved && (stamped==="dark"||stamped==="light")) saved = stamped;
  const sysDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  let mode = saved || (sysDark ? "dark" : "light");
  const apply = ()=>{ document.documentElement.setAttribute("data-theme",mode);
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", mode==="dark"?"#0C1F3F":"#F6F4EF"); };
  apply();
  document.getElementById("themebtn").addEventListener("click",()=>{
    mode = mode==="dark" ? "light" : "dark"; apply();
    try{ localStorage.setItem("jp-theme",mode); }catch(e){}
  });
})();

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
